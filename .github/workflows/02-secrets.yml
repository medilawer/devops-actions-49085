name: Variables secrets and token
on: workflow_dispatch
permissions:
  contents: write
jobs:
  demonstrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Variables and masked secret
        env:
          APP: ${{ vars.APP_NAME }}
          DEMO_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          test -n "$APP"
          test -n "$DEMO_SECRET"
          printf 'Application=%s\n' "$APP"
          printf 'Masking demonstration=%s\n' "$DEMO_SECRET"
      - name: Authenticated REST API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name'
      - name: Authenticated Git operation on evidence branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "evidence/token-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'Run %s by %s\n' "$GITHUB_RUN_ID" "$GITHUB_ACTOR" > token-evidence.txt
          git add token-evidence.txt
          git commit -m 'Record token authentication demonstration'
          git push origin HEAD
